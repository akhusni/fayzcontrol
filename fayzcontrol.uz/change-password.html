<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parolni O'zgartirish | Fayz Medical House</title>
  <meta name="robots" content="noindex, nofollow, noarchive">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="css/unified_header.css?v=7.1">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      background: var(--bg-main, #060e1f);
      color: var(--text-primary, #f8fafc);
    }

    .card {
      width: 100%; max-width: 430px;
      background: var(--bg-panel, #0a1b33);
      border: 1px solid var(--border-color, rgba(255,255,255,0.09));
      border-radius: 16px; padding: 30px 28px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    }

    .head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .head-icon {
      width: 44px; height: 44px; flex: 0 0 auto; border-radius: 12px;
      background: rgba(217, 119, 6, 0.18);
      border: 1px solid rgba(217, 119, 6, 0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem; color: #fbbf24;
    }
    .head h1 { font-size: 1.05rem; font-weight: 800; margin: 0; }
    .head .who { font-size: 0.76rem; color: var(--text-muted, #94a3b8); margin-top: 2px; }

    .why {
      margin: 18px 0 22px;
      padding: 11px 13px; border-radius: 9px;
      background: rgba(217, 119, 6, 0.12);
      border: 1px solid rgba(217, 119, 6, 0.3);
      color: #fcd34d; font-size: 0.82rem; line-height: 1.5;
    }

    .field { margin-bottom: 15px; }
    .field label {
      display: block; font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--text-muted, #94a3b8); margin-bottom: 6px;
    }
    .field input {
      width: 100%; padding: 11px 13px; border-radius: 9px;
      border: 1px solid var(--border-color, rgba(255,255,255,0.12));
      background: var(--bg-input, #060e1f);
      color: var(--text-primary, #f8fafc);
      font-family: inherit; font-size: 0.92rem;
    }
    .field input:focus {
      border-color: var(--primary, #38bdf8);
      box-shadow: 0 0 0 3px var(--primary-glow, rgba(56,189,248,0.25));
      outline: none;
    }
    .hint { font-size: 0.72rem; color: var(--text-dim, #64748b); margin-top: 5px; }

    .btn {
      width: 100%; margin-top: 8px; padding: 12px 16px; min-height: 44px;
      border: none; border-radius: 9px;
      background: var(--primary-dark, #0284c7); color: #fff;
      font-family: inherit; font-size: 0.93rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 9px;
      transition: background 0.15s ease;
    }
    .btn:hover:not(:disabled) { background: var(--primary, #38bdf8); }
    .btn:disabled { opacity: 0.6; cursor: progress; }

    .msg {
      margin-top: 15px; padding: 10px 13px; border-radius: 9px;
      font-size: 0.83rem; font-weight: 600; display: none;
    }
    .msg.visible { display: block; }
    .msg.error {
      background: rgba(225,29,72,0.14); border: 1px solid rgba(225,29,72,0.4); color: #fda4af;
    }
    .msg.ok {
      background: rgba(16,185,129,0.14); border: 1px solid rgba(16,185,129,0.4); color: #6ee7b7;
    }

    body.day-mode, [data-theme="day"] body { background: #eef2f7; }
    body.day-mode .card, [data-theme="day"] .card {
      background: #fff; border-color: #e2e8f0; box-shadow: 0 24px 60px rgba(15,23,42,0.12);
    }
    body.day-mode .field input, [data-theme="day"] .field input {
      background: #f8fafc; border-color: #cbd5e1; color: #0f172a;
    }
    body.day-mode, body.day-mode .head h1 { color: #0f172a; }
  </style>
</head>
<body>
  <main class="card">
    <div class="head">
      <div class="head-icon"><i class="fas fa-key"></i></div>
      <div>
        <h1>Parolni o'zgartirish</h1>
        <div class="who" id="who">&nbsp;</div>
      </div>
    </div>

    <div class="why" id="why-forced" style="display:none;">
      <i class="fas fa-triangle-exclamation"></i>
      Sizning hisobingiz hali boshlang'ich (standart) parolda. Davom etishdan
      oldin faqat o'zingiz biladigan yangi parol o'rnating.
    </div>

    <form id="form" autocomplete="on">
      <div class="field">
        <label for="current">Hozirgi parol</label>
        <input type="password" id="current" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="next">Yangi parol</label>
        <input type="password" id="next" autocomplete="new-password" required minlength="8">
        <div class="hint">Kamida 8 belgi. Ism yoki tug'ilgan yilni ishlatmang.</div>
      </div>
      <div class="field">
        <label for="confirm">Yangi parolni takrorlang</label>
        <input type="password" id="confirm" autocomplete="new-password" required minlength="8">
      </div>
      <button type="submit" class="btn" id="btn">
        <i class="fas fa-check"></i><span>Saqlash</span>
      </button>
    </form>

    <div class="msg" id="msg" role="alert" aria-live="assertive"></div>
    <a id="back-home" href="/" style="display:none;margin-top:14px;font-size:0.85rem;color:inherit;opacity:0.8;">
      <i class="fas fa-arrow-left"></i> Ortga qaytish
    </a>
  </main>

  <script>
    (function () {
      'use strict';

      const form = document.getElementById('form');
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');

      function show(text, kind) {
        msg.textContent = text;
        msg.className = 'msg visible ' + kind;
      }
      function clear() { msg.className = 'msg'; msg.textContent = ''; }

      // Name the account and explain why they are here, if they were forced.
      fetch('/api/auth/session')
        .then(r => r.json())
        .then(d => {
          if (!d || !d.authenticated) { location.replace('/login.html'); return; }
          const u = d.user || {};
          document.getElementById('who').textContent =
            (u.full_name || u.username || '') + (d.role_label ? ' — ' + d.role_label : '');
          if (d.must_change_password) {
            document.getElementById('why-forced').style.display = '';
          } else {
            // Opened voluntarily from the header: let them go back unchanged.
            const back = document.getElementById('back-home');
            back.href = d.home || '/';
            back.style.display = 'inline-block';
          }
        })
        .catch(() => {});

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clear();

        const current = document.getElementById('current').value;
        const next = document.getElementById('next').value;
        const confirm = document.getElementById('confirm').value;

        if (next !== confirm) { show('Yangi parollar mos kelmadi.', 'error'); return; }
        if (next.length < 8) { show("Yangi parol kamida 8 belgidan iborat bo'lishi kerak.", 'error'); return; }

        btn.disabled = true;
        const label = btn.querySelector('span');
        const original = label.textContent;
        label.textContent = 'Saqlanmoqda...';

        try {
          const res = await fetch('/api/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              current_password: current,
              new_password: next,
              confirm_password: confirm
            })
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok) {
            show("Parol o'zgartirildi. Yo'naltirilmoqda...", 'ok');
            setTimeout(() => location.replace(data.home || '/'), 1100);
            return;
          }
          show(data.error || "Parolni o'zgartirib bo'lmadi.", 'error');
        } catch (err) {
          show("Serverga ulanib bo'lmadi.", 'error');
        } finally {
          btn.disabled = false;
          label.textContent = original;
        }
      });
    })();
  </script>
</body>
</html>
